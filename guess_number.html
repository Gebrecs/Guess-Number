<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="GuessNumber.css" />
    <title>Guess My Number!</title>
</head>
<body>
<header>
    <h1>Guess My Number!</h1>
    <p class="between">(Enter a number between 1 and 20, inclusive)</p>
    <button class="btn again">Again!</button>
    <div class="number">?</div>
</header>
<main>
    <!--The main section is the main part of the HTML file or an application, and there is only one main section-->
    <section class="left">
        <label for="guess">Enter a number!
            <input type="number" id="guess" class="guess" />
            <button class="btn check">Check!</button>
        </label>

    </section>
    <section class="right">
        <p class="message">Start guessing...</p>
        <p class="label-score">💯 Score: <span class="score">20</span></p>
        <p class="label-high score">
            🥇 High score: <span class="highscore">0</span>
        </p>
    </section>
</main>
<script src="project%231.js"></script>
</body>
</html>
